name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core has no runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import llm_failover, sys; assert 'anthropic' not in sys.modules and 'openai' not in sys.modules"
          python -m llm_failover.demo
      - name: Install with extras
        run: pip install -e '.[dev,anthropic,openai]'
      - name: Test
        run: python -m pytest -q
