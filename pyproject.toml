[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-failover"
version = "0.1.0"
description = "Multi-provider LLM routing with fallback that never hides a configuration failure."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "L.Finesse Humxn" }]
keywords = ["llm", "failover", "fallback", "circuit-breaker", "retry", "anthropic", "openai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["llm_failover*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
